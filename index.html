<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel de Controle ESP32 - T6GC</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>Automação ESP32</h1>
      <div class="badges">
        <div class="badge">
          <span id="dot-broker" class="dot"></span>
          <span id="txt-broker">Broker</span>
        </div>
        <div class="badge">
          <span id="dot-esp" class="dot"></span>
          <span id="txt-esp">ESP32 Offline</span>
        </div>
      </div>
    </header>

    <!-- Leituras do DHT22 -->
    <section class="grid-sensores">
      <div class="card">
        <div class="sensor-label">🌡️ Temperatura</div>
        <div class="sensor-valor" id="valor-temp">-- °C</div>
      </div>
      <div class="card">
        <div class="sensor-label">💧 Umidade</div>
        <div class="sensor-valor" id="valor-umid">-- %</div>
      </div>
    </section>

    <!-- Controle dos Relés -->
    <section class="grid-controles">
      <div class="card controle-card" id="card-ventoinha">
        <div class="controle-topo">
          <span class="controle-nome">🌀 Ventoinha</span>
          <span class="estado-texto" id="status-ventoinha">Desligada</span>
        </div>
        <button id="btn-ventoinha" data-dispositivo="ventoinha">Ligar</button>
      </div>

      <div class="card controle-card" id="card-lampada">
        <div class="controle-topo">
          <span class="controle-nome">💡 Lâmpada</span>
          <span class="estado-texto" id="status-lampada">Desligada</span>
        </div>
        <button id="btn-lampada" data-dispositivo="lampada">Ligar</button>
      </div>

      <div class="card controle-card" id="card-bomba">
        <div class="controle-topo">
          <span class="controle-nome">🚰 Bomba de Água</span>
          <span class="estado-texto" id="status-bomba">Desligada</span>
        </div>
        <button id="btn-bomba" data-dispositivo="bomba">Ligar</button>
      </div>
    </section>

    <footer id="ultima-atualizacao">Aguardando dados do sensor...</footer>
  </div>
</body>
</html>
