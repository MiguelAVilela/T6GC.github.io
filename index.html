<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Controle de Temperatura - ESP32</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#111; color:#eee;
           display:flex; flex-direction:column; align-items:center;
           justify-content:center; min-height:100vh; margin:0; gap:20px; }
    #lamp { width:120px; height:120px; border-radius:50%; background:#333;
            transition:.3s; box-shadow:0 0 0 #0000; }
    #lamp.on { background:#ffd400; box-shadow:0 0 60px #ffd400; }
    .btns { display:flex; gap:12px; }
    button { font-size:1.1rem; padding:14px 28px; border:0; border-radius:10px;
             cursor:pointer; color:#fff; }
    #btnOn { background:#2e9e4f; }
    #btnOff { background:#c0392b; }
    button:disabled { opacity:.4; cursor:not-allowed; }
    #status { font-size:.9rem; color:#aaa; }
  </style>
</head>
<body>
  <h1>Resistor do ESP32</h1>
  <div id="lamp"></div>
  <div class="btns">
    <button id="btnOn" disabled>Ligar</button>
    <button id="btnOff" disabled>Desligar</button>
  </div>
  <div id="status">Conectando ao broker...</div>

  <script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <script>
    // Troque por um nome único para que ninguém mais controle seu LED
    const TOPICO = "t6gc/miguelavilela/led";
    const TOPICO_STATUS = TOPICO + "/status";

    const client = mqtt.connect("wss://broker.hivemq.com:8884/mqtt", {
      clientId: "site_" + Math.random().toString(16).slice(2, 10)
    });

    const lamp = document.getElementById("lamp");
    const statusEl = document.getElementById("status");
    const btnOn = document.getElementById("btnOn");
    const btnOff = document.getElementById("btnOff");

    client.on("connect", () => {
      statusEl.textContent = "Conectado ao broker ✔";
      btnOn.disabled = btnOff.disabled = false;
      client.subscribe(TOPICO_STATUS);
    });

    client.on("close", () => {
      statusEl.textContent = "Desconectado. Tentando reconectar...";
      btnOn.disabled = btnOff.disabled = true;
    });

    client.on("message", (topic, msg) => {
      if (topic === TOPICO_STATUS) {
        lamp.classList.toggle("on", msg.toString() === "ON");
      }
    });

    btnOn.onclick  = () => client.publish(TOPICO, "ON");
    btnOff.onclick = () => client.publish(TOPICO, "OFF");
  </script>
</body>
</html>
