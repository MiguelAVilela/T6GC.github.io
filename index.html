<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle do ESP32 / Arduino UNO Q</title>
  <!-- Biblioteca MQTT para Navegador -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
    .card { background: #fff; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    button { padding: 12px 24px; font-size: 16px; margin: 10px; border: none; border-radius: 5px; cursor: pointer; color: white; font-weight: bold; }
    .btn-on { background-color: #28a745; }
    .btn-off { background-color: #dc3545; }
    #status { margin-top: 15px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Controle Global do Arduino UNO Q</h2>
    <button class="btn-on" onclick="sendMQTT('H')">LIGAR LED</button>
    <button class="btn-off" onclick="sendMQTT('L')">DESLIGAR LED</button>
    <p id="status">Conectando ao servidor...</p>
  </div>

  <script>
    // Configurações do Broker MQTT Público (HiveMQ)
    const topic = "miguel_avilela/t6gc/led";
    const client = new Paho.MQTT.Client("broker.hivemq.com", 8000, "web_client_" + parseInt(Math.random() * 100, 10));

    client.onConnectionLost = function(responseObject) {
      document.getElementById("status").innerText = "Conexão perdida. A reconectar...";
      document.getElementById("status").style.color = "red";
    };

    client.connect({
      useSSL: true,
      onSuccess: function() {
        document.getElementById("status").innerText = "Conectado! Pronto para enviar comandos.";
        document.getElementById("status").style.color = "green";
      }
    });

    function sendMQTT(state) {
      if (!client.isConnected()) {
        alert("Ainda não está conectado ao servidor MQTT!");
        return;
      }
      const message = new Paho.MQTT.Message(state);
      message.destinationName = topic;
      client.send(message);
      document.getElementById("status").innerText = state === 'H' ? "Comando LIGAR enviado!" : "Comando DESLIGAR enviado!";
    }
  </script>
</body>
</html>
